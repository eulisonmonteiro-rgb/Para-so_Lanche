const SEM_FALTAS = { ingredientes: [], lanches: [], lido: false, hora: null };

/* Divide o CSV respeitando aspas e quebras de linha dentro de celulas. */
function lerCSV(texto) {
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  const t = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"' && t[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ',') { linha.push(campo); campo = ''; }
    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += c;
  }
  linha.push(campo);
  if (linha.some((x) => x !== '')) linhas.push(linha);
  return linhas;
}

const semAcento = (s) =>
  String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

/* "sim", "x", "TRUE", "1", "esgotado" contam como em falta. */
const marcado = (v) => ['sim', 's', 'x', 'true', 'verdadeiro', '1', 'esgotado'].includes(semAcento(v));

function interpretarPlanilha(linhas) {
  let cab = -1;
  for (let i = 0; i < Math.min(linhas.length, 10); i++) {
    if (linhas[i].some((c) => semAcento(c) === 'chave')) { cab = i; break; }
  }
  if (cab === -1) throw new Error('A planilha precisa de uma coluna chamada CHAVE.');
  const titulos = linhas[cab].map(semAcento);
  const cTipo = titulos.indexOf('tipo');
  const cChave = titulos.indexOf('chave');
  const cFalta = titulos.findIndex((t) => t.startsWith('em falta'));
  if (cFalta === -1) throw new Error('A planilha precisa de uma coluna chamada EM FALTA.');

  const ingredientes = [], lanches = [];
  for (let i = cab + 1; i < linhas.length; i++) {
    const l = linhas[i];
    const chave = String(l[cChave] || '').trim();
    if (!chave || !marcado(l[cFalta])) continue;
    const tipo = cTipo > -1 ? semAcento(l[cTipo]) : '';
    if (tipo.startsWith('ingrediente')) ingredientes.push(chave);
    else if (tipo.startsWith('lanche')) lanches.push(chave);
    else if (INGREDIENTES.some((x) => x.chave === chave)) ingredientes.push(chave);
    else lanches.push(chave);
  }
  const agora = new Date();
  return {
    ingredientes,
    lanches,
    lido: true,
    hora: String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0'),
  };
}

async function buscarDisponibilidade() {
  const r = await fetch(PLANILHA_CSV, { cache: 'no-store' });
  if (!r.ok) throw new Error('A planilha respondeu ' + r.status + '.');
  return interpretarPlanilha(lerCSV(await r.text()));
}

/* Um lanche sai do ar por falta de ingrediente ou por chave propria. */
function situacao(item, faltas) {
  if (faltas.lanches.indexOf(item.id) > -1) return { disponivel: false, motivo: 'Esgotado hoje' };
  const ing = (item.ing || []).find((k) => faltas.ingredientes.indexOf(k) > -1);
  if (ing) return { disponivel: false, motivo: 'Sem ' + nomeIngrediente(ing).toLowerCase() + ' hoje' };
  return { disponivel: true, motivo: null };
}

function ModalPedido({ carrinho, onAdicionar, onRemover, onFechar }) {
  const [metodo, setMetodo] = useState('entrega');
  const [endereco, setEndereco] = useState('');
  const [tentou, setTentou] = useState(false);
  const refFundo = useRef(null);

  const linhas = Object.keys(carrinho)
    .map((id) => ({ item: acharItem(id), qtd: carrinho[id] }))
    .filter((l) => l.item && l.qtd > 0);

  const subtotal = linhas.reduce((s, l) => s + l.item.preco * l.qtd, 0);
  const taxa = metodo === 'entrega' ? TAXA_ENTREGA : 0;
  const total = subtotal + taxa;
  const enderecoOk = metodo !== 'entrega' || endereco.trim().length >= 8;

  useEffect(() => {
    const aoTeclar = (e) => { if (e.key === 'Escape') onFechar(); };
    window.addEventListener('keydown', aoTeclar);
    return () => window.removeEventListener('keydown', aoTeclar);
  }, [onFechar]);

  const mensagem = useMemo(() => {
    const itens = linhas.map((l) => l.qtd + 'x ' + l.item.nome + ' - R$ ' + brl(l.item.preco * l.qtd)).join('\n');
    let texto =
      'Ol\u00e1! Gostaria de fazer o seguinte pedido:\n' +
      itens + '\n' +
      'Tipo: ' + (metodo === 'entrega' ? 'Entrega' : 'Retirada') + '\n' +
      'Taxa de Entrega: R$ ' + brl(taxa) + '\n' +
      'Total: R$ ' + brl(total);
    if (metodo === 'entrega') texto += '\nEndere\u00e7o: ' + endereco.trim();
    return texto;
  }, [linhas, metodo, taxa, total, endereco]);

  const link = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(mensagem);

  return (
    <div
      ref={refFundo}
      onMouseDown={(e) => { if (e.target === refFundo.current) onFechar(); }}
      className="surge fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      aria-label="Resumo do pedido"
    >
      <div className="sobe flex max-h-[92vh] w-full max-w-lg flex-col rounded-t-3xl border-t border-borda bg-fumaca md:max-w-xl">
        <div className="shrink-0 px-5 pb-3 pt-3">
          <div className="mx-auto h-1 w-10 rounded-full bg-borda"></div>
          <div className="mt-3 flex items-center justify-between">
            <h2 className="font-display text-[20px] text-creme">Seu pedido</h2>
            <button type="button" onClick={onFechar} className="rounded-full border border-borda px-3 py-1.5 text-[12px] font-bold text-nevoa transition hover:text-creme">
              Fechar
            </button>
          </div>
        </div>

        <div className="min-h-0 flex-1 overflow-y-auto px-5 pb-5">
          <ul className="divide-y divide-borda/70">
            {linhas.map((l) => (
              <li key={l.item.id} className="flex items-center gap-3 py-3">
                <div className="min-w-0 flex-1">
                  <p className="text-[15px] font-bold leading-tight text-creme">{l.item.nome}</p>
                  <p className="num mt-0.5 text-[13px] text-nevoa">
                    {l.qtd} &times; R$ {brl(l.item.preco)} = <span className="font-bold text-ouro">R$ {brl(l.item.preco * l.qtd)}</span>
                  </p>
                </div>
                <Controle
                  qtd={l.qtd}
                  nome={l.item.nome}
                  onAdicionar={() => onAdicionar(l.item.id)}
                  onRemover={() => onRemover(l.item.id)}
                />
              </li>
            ))}
          </ul>

          <div className="mt-6">
            <p className="text-[11px] font-bold uppercase tracking-[0.16em] text-nevoa">Como voc&ecirc; quer receber</p>
            <div className="mt-2.5 flex gap-2.5" role="radiogroup" aria-label="M&eacute;todo de entrega">
              <OpcaoEntrega
                ativo={metodo === 'entrega'}
                titulo="Entrega"
                descricao={'Em domic\u00edlio \u00b7 taxa R$ ' + brl(TAXA_ENTREGA)}
                onClick={() => setMetodo('entrega')}
              />
              <OpcaoEntrega
                ativo={metodo === 'retirada'}
                titulo="Retirada"
                descricao="No local &middot; sem taxa"
                onClick={() => setMetodo('retirada')}
              />
            </div>

            {metodo === 'entrega' ? (
              <div className="surge mt-4">
                <label htmlFor="endereco" className="block text-[13px] font-bold text-creme">
                  Endere&ccedil;o de entrega <span className="text-tijolo">*</span>
                </label>
                <textarea
                  id="endereco"
                  rows="3"
                  value={endereco}
                  onChange={(e) => setEndereco(e.target.value)}
                  onBlur={() => setTentou(true)}
                  placeholder={'Rua, n\u00famero, bairro e um ponto de refer\u00eancia'}
                  className={
                    'mt-2 w-full resize-none rounded-2xl border bg-carvao px-3.5 py-3 text-[16px] text-creme placeholder:text-nevoa/60 focus:outline-none ' +
                    (tentou && !enderecoOk ? 'border-tijolo' : 'border-borda focus:border-ouro')
                  }
                />
                {tentou && !enderecoOk && (
                  <p className="mt-1.5 text-[12.5px] font-semibold text-tijolo">
                    Escreva o endere&ccedil;o completo para o entregador te encontrar.
                  </p>
                )}
              </div>
            ) : (
              <div className="surge mt-4 flex gap-3 rounded-2xl border border-ouro/30 bg-ouro/[0.07] p-3.5">
                <IconePino className="mt-0.5 h-5 w-5 shrink-0 text-ouro" />
                <p className="text-[13px] leading-snug text-creme">
                  <span className="font-bold">Endere&ccedil;o para retirada:</span> {ENDERECO_RETIRADA}
                </p>
              </div>
            )}
          </div>

          <dl className="mt-6 space-y-2 border-t border-borda pt-4 text-[14px]">
            <div className="flex justify-between text-nevoa">
              <dt>Subtotal</dt>
              <dd className="num font-semibold text-creme">R$ {brl(subtotal)}</dd>
            </div>
            <div className="flex justify-between text-nevoa">
              <dt>Taxa de entrega</dt>
              <dd className="num font-semibold text-creme">R$ {brl(taxa)}</dd>
            </div>
            <div className="flex items-baseline justify-between pt-2">
              <dt className="font-display text-[17px] text-creme">Total</dt>
              <dd className="num font-display text-[24px] text-ouro">R$ {brl(total)}</dd>
            </div>
          </dl>
        </div>

        <div className="shrink-0 border-t border-borda bg-fumaca px-5 pt-4" style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom))' }}>
          {enderecoOk ? (
            <a
              href={link}
              target="_blank"
              rel="noopener noreferrer"
              className="flex w-full items-center justify-center gap-2.5 rounded-2xl bg-zap px-4 py-4 text-[15.5px] font-extrabold text-[#04321A] transition active:scale-[.99] hover:brightness-110"
            >
              <IconeZap className="h-5 w-5" />
              Enviar pedido pelo WhatsApp
            </a>
          ) : (
            <button
              type="button"
              onClick={() => setTentou(true)}
              className="flex w-full items-center justify-center gap-2.5 rounded-2xl border border-borda bg-brasa px-4 py-4 text-[15.5px] font-extrabold text-nevoa"
            >
              <IconeZap className="h-5 w-5" />
              Preencha o endere&ccedil;o para enviar
            </button>
          )}
          <p className="mt-2.5 text-center text-[11.5px] text-nevoa">
            O pedido abre no WhatsApp da lanchonete &middot; (93) 99166-8091
          </p>
        </div>
      </div>
    </div>
  );
}

/* Demonstracao: abra a pagina com ?demo=1 para ver a tela de esgotado
   sem precisar mexer na planilha. */
const MODO_DEMO = /(\?|&)demo=1\b/.test(location.search) || location.hash === '#demo';
const FALTAS_DEMO = { ingredientes: ['calabresa', 'bacon'], lanches: ['s2'], lido: true, hora: null };

function App() {
  const [carrinho, setCarrinho] = useState({});
  const [aberto, setAberto] = useState(false);
  const [aba, setAba] = useState(CARDAPIO[0].id);
  const [faltas, setFaltas] = useState(MODO_DEMO ? FALTAS_DEMO : SEM_FALTAS);
  const [retirados, setRetirados] = useState([]);

  const situacoes = useMemo(() => {
    const m = {};
    TODOS.forEach((i) => { m[i.id] = situacao(i, faltas); });
    return m;
  }, [faltas]);

  /* Le a planilha ao abrir, a cada tres minutos e quando o cliente
     volta para a aba. Se a leitura falhar, mantem o ultimo estado
     conhecido: cardapio fora do ar seria pior que um item errado. */
  useEffect(() => {
    if (!PLANILHA_CSV || MODO_DEMO) return;
    let vivo = true;
    const atualizar = () => {
      buscarDisponibilidade()
        .then((f) => { if (vivo) setFaltas(f); })
        .catch((e) => console.warn('Disponibilidade nao lida:', e.message));
    };
    atualizar();
    const t = setInterval(atualizar, INTERVALO_ATUALIZACAO);
    const aoVoltar = () => { if (document.visibilityState === 'visible') atualizar(); };
    document.addEventListener('visibilitychange', aoVoltar);
    return () => { vivo = false; clearInterval(t); document.removeEventListener('visibilitychange', aoVoltar); };
  }, []);

  /* Se um item do carrinho acabou entre uma leitura e outra, ele sai
     do carrinho e o cliente e avisado - nunca vai parar no WhatsApp. */
  useEffect(() => {
    setCarrinho((c) => {
      const fora = Object.keys(c).filter((id) => situacoes[id] && !situacoes[id].disponivel);
      if (fora.length === 0) return c;
      const n = { ...c };
      fora.forEach((id) => delete n[id]);
      setRetirados(fora.map((id) => (acharItem(id) || {}).nome).filter(Boolean));
      return n;
    });
  }, [situacoes]);

  const adicionar = (id) => setCarrinho((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const remover = (id) =>
    setCarrinho((c) => {
      const n = { ...c };
      if (!n[id]) return c;
      n[id] -= 1;
      if (n[id] <= 0) delete n[id];
      return n;
    });

  const quantidade = Object.values(carrinho).reduce((a, b) => a + b, 0);
  const subtotal = Object.keys(carrinho).reduce((s, id) => {
    const it = acharItem(id);
    return it ? s + it.preco * carrinho[id] : s;
  }, 0);

  useEffect(() => {
    if (quantidade === 0 && aberto) setAberto(false);
  }, [quantidade, aberto]);

  useEffect(() => {
    document.body.style.overflow = aberto ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [aberto]);

  useEffect(() => {
    const alvos = CARDAPIO.map((c) => document.getElementById('sec-' + c.id)).filter(Boolean);
    const obs = new IntersectionObserver(
      (entradas) => {
        entradas.forEach((e) => { if (e.isIntersecting) setAba(e.target.id.replace('sec-', '')); });
      },
      { rootMargin: '-64px 0px -70% 0px' }
    );
    alvos.forEach((a) => obs.observe(a));
    return () => obs.disconnect();
  }, []);

  const irPara = (id) => {
    const el = document.getElementById('sec-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  return (
    <div className="tela w-full bg-carvao">
      <Cabecalho faltas={faltas} />
      <Abas ativa={aba} onIr={irPara} />

      <main className="mx-auto w-full max-w-lg px-5 pb-40 pt-2 md:max-w-3xl">
        {MODO_DEMO && (
          <p className="mt-3 rounded-2xl border border-borda bg-brasa px-4 py-2.5 text-center text-[12.5px] font-semibold text-nevoa">
            Modo demonstra&ccedil;&atilde;o &mdash; as faltas mostradas aqui s&atilde;o exemplo, n&atilde;o vieram da planilha.
          </p>
        )}
        {retirados.length > 0 && (
          <div className="surge mt-3 flex items-start gap-3 rounded-2xl border border-tijolo/40 bg-tijolo/10 px-4 py-3">
            <p className="flex-1 text-[13px] leading-snug text-creme">
              Tiramos do seu carrinho porque acabou agora: <span className="font-bold">{retirados.join(', ')}</span>.
            </p>
            <button type="button" onClick={() => setRetirados([])} className="shrink-0 text-[12px] font-bold text-nevoa hover:text-creme">
              OK
            </button>
          </div>
        )}
        {CARDAPIO.map((cat) => (
          <section key={cat.id} id={'sec-' + cat.id} className="scroll-mt-20 pt-7">
            <div className="flex items-baseline gap-3">
              <h2 className="font-display text-[22px] leading-none text-creme md:text-[26px]">{cat.nome}</h2>
              <span className="filete h-[3px] flex-1 rounded-full"></span>
            </div>
            <p className="mt-2 text-[13px] text-nevoa">{cat.resumo}</p>
            <ul className="mt-1 grid grid-cols-1 gap-x-8 md:grid-cols-2">
              {cat.itens.map((item) => (
                <LinhaProduto
                  key={item.id}
                  item={item}
                  qtd={carrinho[item.id] || 0}
                  situacao={situacoes[item.id]}
                  onAdicionar={() => adicionar(item.id)}
                  onRemover={() => remover(item.id)}
                />
              ))}
            </ul>
          </section>
        ))}

        <footer className="mt-12 rounded-2xl border border-borda bg-fumaca p-5">
          <p className="flex items-start gap-2.5 text-[13px] leading-snug text-nevoa">
            <IconePino className="mt-0.5 h-[18px] w-[18px] shrink-0 text-ouro" />
            <span>
              <span className="font-bold text-creme">Para&iacute;so Lanchonete</span> &middot; {ENDERECO_RETIRADA}
            </span>
          </p>
          <p className="mt-3 text-[12px] text-nevoa/80">
            Entrega em domic&iacute;lio com taxa de R$ {brl(TAXA_ENTREGA)}. Retirada no local sem taxa.
          </p>
        </footer>
      </main>

      <BarraCarrinho quantidade={quantidade} subtotal={subtotal} onAbrir={() => setAberto(true)} />

      {aberto && quantidade > 0 && (
        <ModalPedido
          carrinho={carrinho}
          onAdicionar={adicionar}
          onRemover={remover}
          onFechar={() => setAberto(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
